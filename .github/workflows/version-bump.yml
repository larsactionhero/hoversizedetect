name: Version Bump & Publish

on:
  push:
    branches:
      - main

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # nötig für npm Trusted Publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # in Release-Builds keinen Cache nutzen

      # Trusted Publishing benötigt npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@11

      - name: Bump minor version
        id: version
        run: |
          npm version minor --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Kein NPM_TOKEN / keine .npmrc: npm tauscht das OIDC-Token selbst aus.
      # NODE_AUTH_TOKEN muss leer sein, sonst wird OIDC übersprungen.
      - name: Publish to npm
        run: |
          npm config get registry
          npm publish --access public --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ''

      # `npm deprecate` does not support Trusted Publishing (OIDC); therefore, a separate Granular Access Token 
      # (stored as the secret `NPM_DEPRECATE_TOKEN`) with write permissions and 2FA bypass is required. 
      # If this step fails, the workflow will still be marked as successful (green).
      # Experiment: Can the command be executed using OIDC (without a token)? If not, remove the step.
      - name: Deprecate older npm versions
        continue-on-error: true
        run: |
          NAME=$(node -p "require('./package.json').name")
          npm deprecate "${NAME}@<${{ steps.version.outputs.version }}" \
            "Deprecated. Please update to ${{ steps.version.outputs.version }} or newer."
        env:
          NODE_AUTH_TOKEN: ''

      - name: Commit & tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git add package-lock.json 2>/dev/null || true
          git commit -m "chore: bump version to v${{ steps.version.outputs.version }} [skip ci]"
          git tag "v${{ steps.version.outputs.version }}"
          # Der Build ändert getrackte Dateien (z. B. dist/). Verwerfen, sonst bricht pull --rebase ab.
          git restore .
          git pull --rebase origin main
          git push origin main --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          make_latest: true

      # Alle älteren Releases (die noch keine Pre-releases sind) als deprecated markieren.
      # Bereits markierte Releases werden übersprungen, damit der Hinweis nicht doppelt erscheint.
      - name: Deprecate older GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST="v${{ steps.version.outputs.version }}"
          gh release list --repo "${{ github.repository }}" --limit 200 \
            --json tagName,isPrerelease \
            -q '.[] | select(.isPrerelease == false) | .tagName' \
          | { grep -vx "$LATEST" || true; } \
          | while read -r tag; do
              echo "Deprecating $tag"
              BODY=$(gh release view "$tag" --repo "${{ github.repository }}" --json body -q .body)
              gh release edit "$tag" --repo "${{ github.repository }}" \
                --prerelease \
                --notes "⚠️ **DEPRECATED:** Please update to $LATEST.

          $BODY"
            done
