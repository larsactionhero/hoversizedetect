name: Version Bump & Publish

on:
  push:
    branches:
      - main

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # nötig für npm Trusted Publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # in Release-Builds keinen Cache nutzen

      # Trusted Publishing benötigt npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@11

      - name: Bump minor version
        id: version
        run: |
          npm version minor --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Kein NPM_TOKEN / keine .npmrc: npm tauscht das OIDC-Token selbst aus.
      # NODE_AUTH_TOKEN muss leer sein, sonst wird OIDC übersprungen.
      - name: Publish to npm
        run: |
          npm config get registry
          npm publish --access public --registry=https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ''

      - name: Commit & tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git add package-lock.json 2>/dev/null || true
          git commit -m "chore: bump version to v${{ steps.version.outputs.version }} [skip ci]"
          git tag "v${{ steps.version.outputs.version }}"
          # Der Build ändert getrackte Dateien (z. B. dist/). Verwerfen, sonst bricht pull --rebase ab.
          git restore .
          git pull --rebase origin main
          git push origin main --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          generate_release_notes: true